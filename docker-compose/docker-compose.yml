version: '3.8'

services:
  db:
    image: postgres:16
    container_name: db
    restart: always
    environment:
      POSTGRES_DB: ${CORE_DB_NAME}
      POSTGRES_USER: ${CORE_DB_USER}
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  # FOR LOCAL
  keycloak-db:
    image: postgres:16
    container_name: keycloak-db
    restart: always
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  # FOR LOCAL
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.3
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    depends_on:
      - keycloak-db
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_FEATURES: scripts
      KEYCLOAK_FRONTEND_URL: http://localhost:8081
    ports:
      - "8081:8080"
    volumes:
      - ../keycloak-config/quarkus-realm.json:/opt/keycloak/data/import/quarkus-realm.json
      #- ../keycloak-config/quarkus-realm.json:/opt/keycloak/data/import/quarkus-realm-dev.json # uncomment this and comment above line when running core in dev mode

  # FOR LOCAL
  core:
    image: core:latest
    container_name: core
    depends_on:
      - db
      - keycloak
      - redpanda
      - notifications
    env_file:
      - .env
    environment:
      QUARKUS_PROFILE: prod
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/quarkus
      QUARKUS_OIDC_CLIENT_AUTH_SERVER_URL: http://keycloak:8080/realms/quarkus
    ports:
      - "6969:6969"

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.3.3
    container_name: redpanda
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"

      # Kafka API listeners
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092

      # Advertise different addresses for clients (containers vs host)
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092

    ports:
      - "19092:19092"   # host access (IntelliJ, local tools)
      # (optional) - "9644:9644" if you want admin/metrics

  redpanda-console:
    image: redpandadata/console:latest
    container_name: redpanda-console
    depends_on:
      - redpanda
    environment:
      KAFKA_BROKERS: "redpanda:9092"
    ports:
      - "8080:8080"

  notifications:
    image: notifications:latest
    container_name: notifications
    depends_on:
      - redpanda
    environment:
      QUARKUS_PROFILE: prod
    ports:
      - "6970:6970"


volumes:
  pgdata:
  keycloak_pgdata: