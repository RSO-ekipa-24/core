version: '3.8'

services:
  db:
    image: postgres
    container_name: db
    restart: always
    environment:
      POSTGRES_DB: core_db
      POSTGRES_USER: your_username
      POSTGRES_PASSWORD: your_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"

# FOR LOCAL
  keycloak-db:
    image: postgres
    container_name: keycloak-db
    restart: always
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - keycloak_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"

# FOR LOCAL
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.3
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    depends_on:
      - keycloak-db
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KEYCLOAK_FEATURES: scripts
      KEYCLOAK_FRONTEND_URL: http://keycloak:8080
    ports:
      - "8081:8080"
    volumes:
      - ../keycloak-config/quarkus-realm.json:/opt/keycloak/data/import/quarkus-realm.json

# FOR MUSI VPN
  core:
    image: core:latest
    container_name: core
    depends_on:
      - db
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/core_db
      QUARKUS_DATASOURCE_USERNAME: your_username
      QUARKUS_DATASOURCE_PASSWORD: your_password
      QUARKUS_PROFILE: prod
      QUARKUS_OIDC_AUTH_SERVER_URL: https://10.1.1.20/keycloak/realms/quarkus
      QUARKUS_OIDC_CLIENT_AUTH_SERVER_URL: https://10.1.1.20/keycloak/realms/quarkus
    ports:
      - "6969:6969"

# FOR LOCAL
