# =====================
# HTTP
# =====================
quarkus.http.port=${QUARKUS_HTTP_PORT:6969}

# =====================
# DATABASE
# =====================
quarkus.datasource.db-kind=${DB_KIND:postgresql}
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_JDBC_URL}

# Optional per-profile overrides
%dev.quarkus.datasource.jdbc.url=${DEV_DB_JDBC_URL:jdbc:postgresql://localhost:5434/core_db}
%prod.quarkus.datasource.jdbc.url=${PROD_DB_JDBC_URL:jdbc:postgresql://db:5434/core_db}

# =====================
# CONTAINER IMAGE
# =====================
quarkus.container-image.build=${CONTAINER_IMAGE_BUILD:true}
quarkus.container-image.name=${CONTAINER_IMAGE_NAME:core}
quarkus.container-image.group=${CONTAINER_IMAGE_GROUP:}
quarkus.container-image.tag=${CONTAINER_IMAGE_TAG:latest}

# =====================
# HIBERNATE
# =====================
quarkus.hibernate-orm.database.generation=${HIBERNATE_DDL:none}
quarkus.hibernate-orm.log.sql=${HIBERNATE_LOG_SQL:true}

# =====================
# FLYWAY
# =====================
quarkus.flyway.migrate-at-start=${FLYWAY_MIGRATE_AT_START:true}
quarkus.flyway.repair-at-start=${QUARKUS_FLYWAY_REPAIR_AT_START:false}

# =====================
# OIDC (RESOURCE SERVER)
# =====================
quarkus.oidc.auth-server-url=${QUARKUS_OIDC_AUTH_SERVER_URL}
quarkus.oidc.client-id=${QUARKUS_OIDC_CLIENT_ID}
quarkus.oidc.credentials.secret=${QUARKUS_OIDC_CREDENTIALS_SECRET}
quarkus.oidc.application-type=service

# =====================
# SECURITY / HEALTH
# =====================
quarkus.http.auth.permission.health.paths=/q/health/*
quarkus.http.auth.permission.health.policy=permit

quarkus.http.auth.permission.public.paths=/q/health/*
quarkus.http.auth.permission.public.policy=permit

# =====================
# SWAGGER / OPENAPI (permit UI + spec)
# =====================
quarkus.swagger-ui.always-include=true
quarkus.http.auth.permission.swagger.paths=/q/swagger-ui/*,/q/openapi
quarkus.http.auth.permission.swagger.policy=permit

quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# =====================
# OIDC client configuration - needed for now - but need to address this
# =====================
quarkus.oidc-client.auth-server-url=${QUARKUS_OIDC_CLIENT_AUTH_SERVER_URL:http://localhost:8081/realms/quarkus}
quarkus.oidc-client.client-id=${QUARKUS_OIDC_CLIENT_ID:quarkus}
quarkus.oidc-client.credentials.secret=${QUARKUS_OIDC_CREDENTIALS_SECRET}
oidc-client.realm=${QUARKUS_OIDC_CLIENT_REALM:quarkus}
quarkus.oidc-client.grant.type=code
quarkus.oidc-client.enabled=${QUARKUS_OIDC_CLIENT_ENABLED:true}

# =====================
# CORS
# =====================
quarkus.http.cors=${QUARKUS_CORS_ENABLED:true}
quarkus.http.cors.origins=${QUARKUS_CORS_ORIGIN_URL:http://localhost:4200}
quarkus.http.cors.methods=${QUARKUS_CORS_METHODS:GET,POST,PUT,DELETE,OPTIONS}
quarkus.http.cors.headers=${QUARKUS_CORS_HEADERS:accept,content-type,origin,authorization,x-requested-with}
quarkus.http.cors.exposed-headers=${QUARKUS_CORS_EXPOSED_HEADERS:authorization}
quarkus.http.cors.credentials=${QUARKUS_CORS_CREDENTIALS:true}

# =====================
# SMTP
# =====================
quarkus.mailer.mock=${MAILER_MOCK:false}
quarkus.mailer.from=${MAILER_FROM}
quarkus.mailer.host=${MAILER_HOST:smtp.gmail.com}
quarkus.mailer.port=${MAILER_PORT:465}
quarkus.mailer.ssl=${MAILER_SSL:true}
quarkus.mailer.auth=${MAILER_AUTH:true}
quarkus.mailer.username=${MAILER_USERNAME}
quarkus.mailer.password=${MAILER_PASSWORD}

# =====================
# TLS
# =====================
quarkus.tls.trust-all=${TLS_TRUST_ALL:true}

# =====================
# Kafka/Redpanda
# =====================

# Dev profile - channel active (if you run locally)
%dev.mp.messaging.outgoing.user-created-out.enabled=true
%dev.mp.messaging.outgoing.user-created-out.bootstrap.servers=localhost:19092

# Prod profile - channel disabled until Redpanda is deployed
#%prod.mp.messaging.outgoing.user-created-out.enabled=true
#%prod.kafka.bootstrap.servers=redpanda:9092

# Common channel settings
mp.messaging.outgoing.user-created-out.connector=smallrye-kafka
mp.messaging.outgoing.user-created-out.topic=user-created
mp.messaging.outgoing.user-created-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer